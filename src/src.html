<title>Chromebook Triage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>/*BOOTSTRAP_CSS*/</style>
<style>
/* Layout: GSX-style service console. Dark command bar, device panel on the left, one troubleshooting card with a Yes/No answer bar. */
:root {
  --tg-bg: #eef1f5;
  --tg-surface: #ffffff;
  --tg-surface-2: #f6f8fa;
  --tg-line: #dde2e9;
  --tg-ink: #1d2430;
  --tg-muted: #5f6b7a;
  --tg-bar: #24282e;
  --tg-bar-ink: #e9edf2;
  --tg-bar-muted: #9aa4b1;
  --tg-accent: #1f5fbf;
  --tg-accent-soft: #e6effb;
  --tg-on-accent: #ffffff;
  --tg-yes: #1d7a4a;
  --tg-yes-soft: #e4f3ea;
  --tg-no: #b42318;
  --tg-no-soft: #fbe9e7;
  --tg-warn-soft: #fff6dd;
  --tg-warn-line: #ecd48c;
  --tg-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --tg-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --tg-bg: #13161a; --tg-surface: #1b1f24; --tg-surface-2: #22272d; --tg-line: #2f353d;
    --tg-ink: #e6eaef; --tg-muted: #97a2af; --tg-bar: #0d0f12; --tg-bar-ink: #e9edf2; --tg-bar-muted: #8c96a3;
    --tg-accent: #6ea3f0; --tg-accent-soft: #1d2b40; --tg-on-accent: #0d1626; --tg-yes: #5cc28c; --tg-yes-soft: #17301f;
    --tg-no: #f08a7e; --tg-no-soft: #3a1d1a; --tg-warn-soft: #33290f; --tg-warn-line: #6b5a22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --tg-bg: #13161a; --tg-surface: #1b1f24; --tg-surface-2: #22272d; --tg-line: #2f353d;
  --tg-ink: #e6eaef; --tg-muted: #97a2af; --tg-bar: #0d0f12; --tg-bar-ink: #e9edf2; --tg-bar-muted: #8c96a3;
  --tg-accent: #6ea3f0; --tg-accent-soft: #1d2b40; --tg-on-accent: #0d1626; --tg-yes: #5cc28c; --tg-yes-soft: #17301f;
  --tg-no: #f08a7e; --tg-no-soft: #3a1d1a; --tg-warn-soft: #33290f; --tg-warn-line: #6b5a22;
  color-scheme: dark;
}

body {
  background: var(--tg-bg); color: var(--tg-ink); font-family: var(--tg-font); font-size: 14px;
  --bs-body-bg: var(--tg-bg); --bs-body-color: var(--tg-ink); --bs-border-color: var(--tg-line);
  --bs-link-color-rgb: 31,95,191; --bs-emphasis-color: var(--tg-ink); --bs-secondary-color: var(--tg-muted);
  --bs-tertiary-bg: var(--tg-surface-2); --bs-body-font-family: var(--tg-font);
}
.mono { font-family: var(--tg-mono); font-variant-numeric: tabular-nums; }
.icon { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex: none; }
.icon svg { width: 100%; height: 100%; display: block; }
kbd { background: var(--tg-surface-2); color: var(--tg-ink); border: 1px solid var(--tg-line); border-bottom-width: 2px; font-family: var(--tg-mono); font-size: .8em; padding: .05em .4em; border-radius: 4px; }
a { color: var(--tg-accent); }
:focus-visible { outline: 2px solid var(--tg-accent); outline-offset: 2px; }

/* Command bar */
.tg-bar { background: var(--tg-bar); color: var(--tg-bar-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.tg-bar-inner { display: flex; align-items: center; gap: 12px; min-height: 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1320px; margin: 0 auto; }
.tg-brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: .01em; color: var(--tg-bar-ink); text-decoration: none; white-space: nowrap; background: none; border: 0; padding: 0; font-size: 15px; }
.tg-brand .mark { width: 24px; height: 24px; border-radius: 6px; background: linear-gradient(160deg, #4f8ff0, #1f5fbf); display: grid; place-items: center; color: #fff; font-size: 13px; }
.tg-crumbs { display: flex; align-items: center; gap: 6px; color: var(--tg-bar-muted); font-size: 13px; min-width: 0; overflow: hidden; }
.tg-crumbs span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tg-crumbs .cur { color: var(--tg-bar-ink); }
.tg-search { margin-left: auto; position: relative; width: 220px; flex: none; }
.tg-search input { background: #ffffff1a; border: 1px solid #ffffff22; color: var(--tg-bar-ink); border-radius: 999px; padding: 4px 12px 4px 30px; width: 100%; font-size: 13px; }
.tg-search input::placeholder { color: var(--tg-bar-muted); }
.tg-search input:focus { outline: none; background: #ffffff26; border-color: #ffffff44; }
.tg-search .icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--tg-bar-muted); font-size: 12px; }

.tg-main { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
.tg-grid { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 20px; align-items: start; }

/* Side panel */
.tg-side { display: grid; gap: 14px; position: sticky; top: calc(64px + env(safe-area-inset-top, 0px)); }
.tg-panel { background: var(--tg-surface); border: 1px solid var(--tg-line); border-radius: 10px; padding: 14px 16px; }
.tg-panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--tg-muted); font-weight: 600; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
.tg-device-head { display: flex; gap: 10px; align-items: center; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--tg-line); }
.tg-device-head .glyph { width: 40px; height: 40px; border-radius: 8px; background: var(--tg-surface-2); display: grid; place-items: center; color: var(--tg-muted); font-size: 20px; flex: none; }
.tg-device-head .name { font-weight: 600; line-height: 1.25; word-break: break-word; }
.tg-device-head .serial { font-size: 12px; color: var(--tg-muted); }
.tg-panel .form-label { font-size: 12px; color: var(--tg-muted); margin-bottom: 3px; }
.tg-panel .form-control, .tg-panel .form-select { font-size: 13px; padding: 5px 9px; background-color: var(--tg-surface); color: var(--tg-ink); border-color: var(--tg-line); }
.tg-panel .form-control:focus, .tg-panel .form-select:focus { border-color: var(--tg-accent); box-shadow: 0 0 0 3px var(--tg-accent-soft); }
.tg-refs { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; font-size: 13px; }
.tg-refs a { text-decoration: none; }
.tg-refs a:hover { text-decoration: underline; }
.tg-refs .active a { font-weight: 600; }

/* Console card */
.tg-console { background: var(--tg-surface); border: 1px solid var(--tg-line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; min-height: 560px; box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px -12px rgba(16,24,40,.12); }
.tg-tabs { display: flex; gap: 2px; padding: 8px 10px 0; background: var(--tg-surface-2); border-bottom: 1px solid var(--tg-line); overflow-x: auto; }
.tg-tab { border: 1px solid transparent; border-bottom: 0; background: none; color: var(--tg-muted); padding: 8px 14px; border-radius: 8px 8px 0 0; font-size: 13px; display: flex; align-items: center; gap: 7px; white-space: nowrap; margin-bottom: -1px; }
.tg-tab:hover { color: var(--tg-ink); }
.tg-tab.active { background: var(--tg-surface); color: var(--tg-ink); border-color: var(--tg-line); font-weight: 500; }
.tg-tab .badge { background: var(--tg-accent-soft); color: var(--tg-accent); font-weight: 600; }

.tg-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--tg-line); }
.tg-head h1 { font-size: 15px; font-weight: 600; margin: 0; text-align: center; text-wrap: balance; }
.btn-back { justify-self: start; font-size: 13px; padding: 4px 12px 4px 9px; border-radius: 6px; border: 1px solid var(--tg-line); background: var(--tg-surface); color: var(--tg-ink); display: inline-flex; align-items: center; gap: 5px; }
.btn-back:hover { background: var(--tg-surface-2); }
.btn-back:disabled { opacity: .4; }
.tg-stages { justify-self: end; display: flex; gap: 4px; align-items: center; font-size: 11px; color: var(--tg-muted); }
.tg-stage { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.tg-stage .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tg-line); }
.tg-stage.done .dot { background: var(--tg-yes); }
.tg-stage.on { color: var(--tg-ink); font-weight: 600; }
.tg-stage.on .dot { background: var(--tg-accent); box-shadow: 0 0 0 3px var(--tg-accent-soft); }
.tg-stage + .tg-stage::before { content: ""; width: 10px; height: 1px; background: var(--tg-line); margin-right: 4px; }

.tg-body { flex: 1; padding: 28px 40px 32px; overflow-wrap: anywhere; }
.tg-body .lead-title { color: var(--tg-accent); font-size: 19px; font-weight: 600; margin: 0 0 14px; text-wrap: balance; }
.tg-body p, .tg-body li { line-height: 1.6; max-width: 68ch; }
.tg-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--tg-muted); font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.tg-eyebrow .step-no { font-family: var(--tg-mono); letter-spacing: 0; color: var(--tg-accent); background: var(--tg-accent-soft); padding: 1px 7px; border-radius: 4px; }
.tg-h3 { font-size: 13px; font-weight: 600; margin: 22px 0 8px; }
.tg-warn { background: var(--tg-warn-soft); border: 1px solid var(--tg-warn-line); border-radius: 8px; padding: 10px 12px; margin-top: 16px; max-width: 68ch; }
.tg-note { background: var(--tg-accent-soft); border-radius: 8px; padding: 10px 12px; margin-top: 16px; max-width: 68ch; display: flex; gap: 8px; }
.tg-note .icon { color: var(--tg-accent); margin-top: 3px; }
.tg-ref-link { display: inline-flex; gap: 6px; align-items: center; margin-top: 16px; font-size: 13px; text-decoration: none; }
.tg-ref-link:hover { text-decoration: underline; }
.tg-progress { height: 3px; background: var(--tg-line); }
.tg-progress > div { height: 100%; background: var(--tg-accent); transition: width .25s ease; }

/* Symptom grid */
.tg-symgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.tg-sym { text-align: left; border: 1px solid var(--tg-line); background: var(--tg-surface); border-radius: 10px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; color: var(--tg-ink); transition: border-color .15s, background .15s, transform .15s; }
.tg-sym:hover { border-color: var(--tg-accent); background: var(--tg-accent-soft); }
.tg-sym:active { transform: scale(.99); }
.tg-sym .ic { width: 34px; height: 34px; border-radius: 8px; background: var(--tg-surface-2); display: grid; place-items: center; font-size: 17px; color: var(--tg-accent); flex: none; }
.tg-sym strong { display: block; font-weight: 600; margin-bottom: 2px; }
.tg-sym small { color: var(--tg-muted); line-height: 1.4; display: block; }
.tg-sym.feature { grid-column: 1 / -1; background: var(--tg-surface-2); }
.tg-sym.feature .ic { background: var(--tg-accent); color: var(--tg-on-accent); }
.tg-empty { color: var(--tg-muted); padding: 30px 0; }

.tg-causes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; max-width: 760px; }
.tg-cause { border: 1px solid var(--tg-line); border-radius: 8px; padding: 10px 12px; }
.tg-cause .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--tg-muted); font-weight: 600; margin-bottom: 3px; }
.tg-symlist { padding-left: 1.2em; margin: 0; }
.tg-qlist { counter-reset: q; list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; max-width: 68ch; }
.tg-qlist li { counter-increment: q; display: flex; gap: 10px; color: var(--tg-muted); }
.tg-qlist li::before { content: counter(q); font-family: var(--tg-mono); font-size: 12px; min-width: 18px; color: var(--tg-muted); padding-top: 2px; }
.tg-qlist li.now { color: var(--tg-ink); font-weight: 600; }
.tg-qlist li.now::before { color: var(--tg-accent); }
.tg-qlist li.past { text-decoration: line-through; text-decoration-color: var(--tg-line); }

/* Answer bar */
.tg-answer { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--tg-line); background: var(--tg-surface-2); flex-wrap: wrap; }
.tg-answer .q { font-weight: 600; flex: 1 1 260px; min-width: 0; }
.tg-answer .btns { display: flex; gap: 8px; margin-left: auto; }
.btn-yn { min-width: 84px; font-weight: 600; font-size: 13px; padding: 6px 14px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--tg-line); background: var(--tg-surface); color: var(--tg-ink); }
.btn-yn:hover { background: var(--tg-surface-2); }
.btn-yn.yes:hover { background: var(--tg-yes-soft); border-color: var(--tg-yes); color: var(--tg-yes); }
.btn-yn.no:hover { background: var(--tg-no-soft); border-color: var(--tg-no); color: var(--tg-no); }
.btn-yn.primary { background: var(--tg-accent); border-color: var(--tg-accent); color: var(--tg-on-accent); }
.btn-yn.primary:hover { filter: brightness(1.08); background: var(--tg-accent); color: var(--tg-on-accent); }
.btn-yn .k { font-family: var(--tg-mono); font-size: 10px; opacity: .55; font-weight: 400; }

/* Result */
.tg-result-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 18px; }
.tg-result-head .ic { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; flex: none; }
.tg-result-head.fail .ic { background: var(--tg-no-soft); color: var(--tg-no); }
.tg-result-head.ok .ic { background: var(--tg-yes-soft); color: var(--tg-yes); }
.tg-result-head.esc .ic { background: var(--tg-warn-soft); color: var(--tg-ink); }
.tg-codes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--tg-line); border-radius: 10px; overflow: hidden; max-width: 640px; margin: 18px 0 6px; }
.tg-codes > div { padding: 10px 14px; border-right: 1px solid var(--tg-line); }
.tg-codes > div:last-child { border-right: 0; }
.tg-codes .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--tg-muted); font-weight: 600; }
.tg-codes .v { font-size: 17px; font-weight: 600; margin-top: 2px; }
.tg-steps { padding-left: 0; list-style: none; margin: 0; display: grid; gap: 2px; max-width: 760px; }
.tg-steps li { display: grid; grid-template-columns: 84px minmax(0, 1fr) 52px; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--tg-line); align-items: baseline; max-width: none; }
.tg-steps .ph { font-size: 11px; color: var(--tg-muted); text-transform: uppercase; letter-spacing: .06em; }
.ans { font-size: 11px; font-weight: 700; text-align: center; border-radius: 4px; padding: 1px 0; }
.ans.y { background: var(--tg-yes-soft); color: var(--tg-yes); }
.ans.n { background: var(--tg-no-soft); color: var(--tg-no); }
.ans.i { background: var(--tg-surface-2); color: var(--tg-muted); }
.tg-notes textarea { font-family: var(--tg-mono); font-size: 12px; background: var(--tg-surface-2); color: var(--tg-ink); border-color: var(--tg-line); min-height: 190px; }
.tg-flash { background: var(--tg-accent-soft); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin-bottom: 18px; display: flex; gap: 8px; align-items: center; }

.table { --bs-table-bg: transparent; --bs-table-color: var(--tg-ink); --bs-table-border-color: var(--tg-line); font-size: 13px; }
.table th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--tg-muted); font-weight: 600; }

/* Model profiles: manual figures, procedures */
.tg-hint { font-size: 12px; color: var(--tg-muted); background: var(--tg-surface-2); border-radius: 6px; padding: 6px 8px; }
.tg-hint strong { color: var(--tg-ink); }
.tg-device-head .photo { width: 64px; height: 44px; border-radius: 6px; background: #fff; border: 1px solid var(--tg-line); object-fit: contain; flex: none; padding: 2px; }
.tg-man-title { font-weight: 600; line-height: 1.35; font-size: 13px; }
.tg-man-meta { font-size: 12px; color: var(--tg-muted); margin: 4px 0 10px; }
.tg-man-list { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 4px; font-size: 12.5px; }
.tg-man-list li { display: flex; gap: 6px; align-items: baseline; }
.tg-man-list li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--tg-accent); flex: none; transform: translateY(-2px); }
.tg-man-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.btn-chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--tg-line); background: var(--tg-surface); color: var(--tg-ink); display: inline-flex; align-items: center; gap: 5px; }
.btn-chip:hover { border-color: var(--tg-accent); color: var(--tg-accent); }
.tg-model-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tg-accent); background: var(--tg-accent-soft); border-radius: 999px; padding: 2px 10px; margin-bottom: 14px; }
.tg-src { font-family: var(--tg-mono); font-size: 10.5px; letter-spacing: 0; text-transform: none; color: var(--tg-muted); border: 1px solid var(--tg-line); border-radius: 4px; padding: 0 6px; font-weight: 500; }
.tg-figs { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 18px; max-width: 900px; }
.tg-fig { margin: 0; border: 1px solid var(--tg-line); border-radius: 10px; overflow: hidden; background: var(--tg-surface); }
.tg-fig button { display: block; width: 100%; padding: 0; border: 0; background: #fff; cursor: zoom-in; }
.tg-fig img { display: block; width: 100%; height: 170px; object-fit: contain; padding: 8px; }
.tg-fig figcaption { font-size: 12px; color: var(--tg-muted); padding: 8px 10px; border-top: 1px solid var(--tg-line); line-height: 1.4; }
.tg-proclink { margin-top: 14px; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; border: 1px solid var(--tg-line); background: var(--tg-surface); color: var(--tg-ink); border-radius: 8px; padding: 6px 12px; }
.tg-proclink:hover { border-color: var(--tg-accent); color: var(--tg-accent); }
.tg-proclink .no { font-family: var(--tg-mono); font-size: 12px; color: var(--tg-accent); }
.tg-proc { border: 1px solid var(--tg-line); border-radius: 12px; padding: 16px 18px; margin-top: 16px; max-width: 900px; }
.tg-proc-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; margin-bottom: 10px; }
.tg-proc-head .no { font-family: var(--tg-mono); font-weight: 600; color: var(--tg-accent); }
.tg-proc-head .nm { font-weight: 600; font-size: 15px; }
.tg-proc-head .badge-cru { font-size: 11px; background: var(--tg-surface-2); color: var(--tg-muted); border-radius: 4px; padding: 1px 7px; }
.tg-chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; margin-bottom: 10px; }
.tg-chain .lbl { color: var(--tg-muted); }
.tg-chain .sep { color: var(--tg-muted); }
.tg-proc ol { padding-left: 1.3em; margin: 6px 0 0; }
.tg-proc ol li { margin-bottom: 3px; }
.tg-proc .k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--tg-muted); font-weight: 600; margin-top: 12px; }
.tg-picks { display: grid; gap: 8px; margin-top: 6px; }
.tg-pick { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.tg-pick .lbl { font-size: 13px; min-width: 120px; }
.tg-pick .btn { font-size: 12.5px; }
.tg-pick .btn-primary { background: var(--tg-accent); border-color: var(--tg-accent); color: var(--tg-on-accent); }
.tg-pick .btn-outline-secondary { color: var(--tg-ink); border-color: var(--tg-line); }
.tg-pick .btn-outline-secondary:hover { background: var(--tg-accent-soft); color: var(--tg-accent); border-color: var(--tg-accent); }
.tg-pn { margin-top: 10px; font-size: 13px; padding: 8px 12px; border-radius: 8px; background: var(--tg-surface-2); display: inline-block; }
.tg-pn .mono { font-weight: 600; color: var(--tg-accent); font-size: 14px; }
.tg-screws { font-size: 13px; margin-top: 4px; border-collapse: collapse; }
.tg-screws td { padding: 3px 14px 3px 0; border-bottom: 1px solid var(--tg-line); }
.tg-list { padding-left: 1.2em; margin: 6px 0 0; max-width: 72ch; }
.tg-list li { margin-bottom: 3px; }
.modal-content { background: var(--tg-surface); color: var(--tg-ink); border-color: var(--tg-line); }
.modal-header { border-color: var(--tg-line); }
.modal-title { font-size: 15px; font-weight: 600; }
.modal.show { display: block; }
.modal-backdrop { --bs-backdrop-opacity: .55; }
.tg-big { background: #fff; border-radius: 8px; border: 1px solid var(--tg-line); }
.tg-big img { display: block; width: 100%; height: auto; max-height: 75vh; object-fit: contain; }
.tg-big-cap { font-size: 13px; color: var(--tg-muted); margin: 8px 0 18px; }
.tg-parts-row { cursor: pointer; }
.tg-parts-row td:first-child { white-space: nowrap; }
.tg-parts-row:hover td { background: var(--tg-accent-soft); }
.tg-ex { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-bottom: 18px; }
.tg-ex .tg-fig img { height: 300px; }

.tg-toast { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--tg-bar); color: var(--tg-bar-ink); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 50; }

@media (max-width: 991.98px) {
  .tg-grid { grid-template-columns: minmax(0, 1fr); }
  .tg-side { position: static; order: 2; }
  .tg-body { padding: 22px 20px 26px; }
  .tg-search { width: 160px; }
}
@media (max-width: 575.98px) {
  .tg-crumbs { display: none; }
  .tg-search { width: auto; flex: 1; }
  .tg-head { grid-template-columns: auto 1fr; }
  .tg-head h1 { text-align: right; }
  .tg-stages { grid-column: 1 / -1; justify-self: start; flex-wrap: wrap; }
  .tg-causes { grid-template-columns: 1fr; }
  .tg-codes { grid-template-columns: 1fr; }
  .tg-codes > div { border-right: 0; border-bottom: 1px solid var(--tg-line); }
  .tg-codes > div:last-child { border-bottom: 0; }
  .tg-steps li { grid-template-columns: minmax(0, 1fr) 40px; }
  .tg-steps .ph { grid-column: 1 / -1; }
  .tg-answer .btns { width: 100%; }
  .btn-yn { flex: 1; }
  .btn-yn .k { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="tg-bar">
  <div class="tg-bar-inner">
    <button class="tg-brand" id="brand" type="button" aria-label="Start a new diagnosis"><span class="mark" data-icon="tools"></span>Triage</button>
    <nav class="tg-crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
    <div class="tg-search">
      <span data-icon="search"></span>
      <input id="search" type="search" placeholder="Search symptoms" aria-label="Search symptoms" autocomplete="off">
    </div>
  </div>
</header>

<main class="tg-main">
  <div class="tg-grid">
    <aside class="tg-side">
      <section class="tg-panel" aria-labelledby="dev-h">
        <h2 id="dev-h" class="visually-hidden">Device</h2>
        <div class="tg-device-head">
          <div class="glyph" data-icon="laptop"></div>
          <div style="min-width:0">
            <div class="name" id="dev-name">Chromebook</div>
            <div class="serial mono" id="dev-serial-show">No serial entered</div>
          </div>
        </div>
        <form id="dev-form" class="d-grid gap-2" autocomplete="off">
          <div><label class="form-label" for="f-profile">Model</label>
            <select class="form-select" id="f-profile"></select></div>
          <div class="row g-2">
            <div class="col-6"><label class="form-label" for="f-mt">Machine type</label><input class="form-control mono" id="f-mt" placeholder="82M1" maxlength="10"></div>
            <div class="col-6"><label class="form-label" for="f-serial">Serial</label><input class="form-control mono" id="f-serial" placeholder="PF3XXXXX"></div>
          </div>
          <div id="mt-hint" class="tg-hint" hidden></div>
          <div class="row g-2">
            <div class="col-6"><label class="form-label" for="f-asset">Asset tag</label><input class="form-control mono" id="f-asset" placeholder="CB-0142"></div>
            <div class="col-6"><label class="form-label" for="f-model">Model detail</label><input class="form-control" id="f-model" placeholder="Optional"></div>
          </div>
          <div><label class="form-label" for="f-form">Form factor</label>
            <select class="form-select" id="f-form"><option>Clamshell</option><option>Convertible (360°)</option><option>Tablet / detachable</option></select></div>
          <div class="form-check form-switch mt-1">
            <input class="form-check-input" type="checkbox" role="switch" id="f-managed" checked>
            <label class="form-check-label" for="f-managed" style="font-size:13px">Enrolled in a school or company domain</label>
          </div>
          <div><label class="form-label" for="f-user">Reported by</label><input class="form-control" id="f-user" placeholder="Student or staff name"></div>
        </form>
      </section>
      <section class="tg-panel" id="manual-panel" aria-labelledby="man-h" hidden>
        <h2 id="man-h"><span data-icon="book"></span>About this model</h2>
        <div id="manual-body"></div>
      </section>
      <section class="tg-panel" aria-labelledby="ref-h">
        <h2 id="ref-h"><span data-icon="journal-text"></span>Articles</h2>
        <ul class="tg-refs" id="refs"></ul>
      </section>
    </aside>

    <section class="tg-console" aria-live="polite">
      <div class="tg-tabs" role="tablist">
        <button class="tg-tab active" role="tab" data-tab="trouble" id="tab-trouble" aria-selected="true"><span data-icon="wrench-adjustable"></span>Troubleshooting</button>
        <button class="tg-tab" role="tab" data-tab="log" id="tab-log" aria-selected="false"><span data-icon="list-check"></span>Steps <span class="badge rounded-pill" id="log-count">0</span></button>
        <button class="tg-tab" role="tab" data-tab="parts" id="tab-parts" aria-selected="false" hidden><span data-icon="cpu"></span>Parts</button>
        <button class="tg-tab" role="tab" data-tab="codes" id="tab-codes" aria-selected="false"><span data-icon="upc-scan"></span>Codes</button>
      </div>
      <div class="tg-head">
        <button class="btn-back" id="back" type="button"><span data-icon="chevron-left"></span>Back</button>
        <h1 id="title">Select a symptom</h1>
        <div class="tg-stages" id="stages"></div>
      </div>
      <div class="tg-progress"><div id="progress" style="width:0%"></div></div>
      <div class="tg-body" id="body"></div>
      <div class="tg-answer" id="answer"></div>
    </section>
  </div>
</main>
<div class="tg-toast" id="toast" hidden></div>

<div class="modal fade" id="viewer" tabindex="-1" aria-labelledby="viewer-title" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable modal-fullscreen-md-down">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="viewer-title">Figure</h2>
        <button type="button" class="btn-close" id="viewer-close" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="viewer-body"></div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade" id="viewer-backdrop" hidden></div>
